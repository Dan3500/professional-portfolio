<!-- La portada (#mask) va fuera de .app-container: el pin de GSAP le deja un transform residual que rompería los position:fixed de dentro -->
<app-intro-hero />

<div class="app-container px-4 px-md-0" id="app-container">
    <app-about />

    <app-why-me />

    <app-skills />

    <div class="section-5__spacer"></div>
</div>

<section id="section-project-stories" class="section-project-stories">
    <app-project-showcase [projects]="showcaseProjects" (mediaOpen)="openMedia($event)" />
</section>

<app-contact />

<div #mediaLightbox class="media-lightbox" role="dialog" aria-modal="true" aria-label="Imagen ampliada" (click)="closeMedia()">
    <div class="media-lightbox__backdrop"></div>
    <button type="button" class="media-lightbox__close" (click)="closeMedia()" aria-label="Cerrar">✕</button>

    @if (activeMedia) {
        @if (activeMedia.type === 'video') {
            <video class="media-lightbox__media" [src]="activeMedia.src" autoplay muted [muted]="true" loop playsinline controls (click)="$event.stopPropagation()"></video>
        } @else {
            <img class="media-lightbox__media" [src]="activeMedia.src" alt="" decoding="async" (click)="$event.stopPropagation()" />
        }
    }
</div>

<button
    #avatarButton
    type="button"
    class="avatar-button"
    (click)="openGallery()"
    aria-label="Abrir galería de imágenes"
>
    <img src="assets/img/avatar.jpg" alt="Daniel Soltero" />
</button>

<div #galleryOverlay class="gallery-overlay" role="dialog" aria-modal="true" aria-label="Galería de imágenes">
    <button type="button" class="gallery-overlay__close" (click)="closeGallery()" aria-label="Cerrar galería">✕</button>

    <button type="button" class="gallery-overlay__nav gallery-overlay__nav--prev" (click)="prevGalleryImage()" aria-label="Imagen anterior">‹</button>

    <div #galleryTrack class="gallery-overlay__track">
        @for (image of galleryImages; track image) {
            <div class="gallery-overlay__slide">
                <img [src]="image" alt="" loading="lazy" decoding="async" />
            </div>
        }
    </div>

    <button type="button" class="gallery-overlay__nav gallery-overlay__nav--next" (click)="nextGalleryImage()" aria-label="Siguiente imagen">›</button>
</div>

<button
    type="button"
    class="menu-toggle"
    [class.menu-toggle--open]="isMenuOpen"
    (click)="toggleMenu()"
    [attr.aria-expanded]="isMenuOpen"
    aria-label="Abrir menú"
>
    <span class="menu-toggle__line"></span>
    <span class="menu-toggle__line"></span>
</button>

<div class="menu-overlay" (click)="closeMenu()">
    <nav class="menu-panel" role="dialog" aria-modal="true" aria-label="Menú de navegación" (click)="$event.stopPropagation()">
        <button type="button" class="menu-panel__item" (click)="goToTop()">Inicio</button>
        <button type="button" class="menu-panel__item" (click)="goToLabel('section2Visible')">Who I am</button>
        <button type="button" class="menu-panel__item" (click)="goToLabel('s4Settled')">Why me?</button>
        <button type="button" class="menu-panel__item" (click)="goToLabel('s5Opaque')">Skills</button>
        <button type="button" class="menu-panel__item" (click)="goToElement('section-project-stories')">Projects</button>
        <button type="button" class="menu-panel__item" (click)="goToElement('section-7')">Contact</button>
    </nav>
</div>
